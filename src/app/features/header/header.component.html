<div class="container-fluid">
  <div class="row">
    @if(!!logUser)
    {
    <div class="d-flex flex-column justify-content-between col-2 bg-dark min-vh-100" style="width: 14%;">
      <div class="bg-dark p-2" >
        <a class="text-white d-none d-sm-inline
              text-decoration-none d-flex  align-items-center ">
          <span class="fs-5">SnacksCalculation
          </span>

        </a>
        <hr class="text-white d-none d-sm-block" />
        <ul class="nav nav-pills flex-column mt-2 mt-sm-0" id="menu">
          <li class="nav-item ">
            <a (click)="goToDashboard()" class="nav-link text-white" aria-current="page">
              <i class="fa fa-table"> </i>
              <span class=" ms-2 d-none d-sm-inline"> Dashboard</span>
            </a>

          </li>
          @if(logUser.typ!="2")
          {
          <li class="nav-item ">
            <a (click)="goToHome()" class="nav-link text-white" aria-current="page">
              <i class="fa fa-money"> </i>
              <span class=" ms-2 d-none d-sm-inline"> Add Money</span>
            </a>

          </li>
          }

          @if(logUser.typ=="0")
          {
          <li class="nav-item ">
            <a (click)="addNewUser()" class="nav-link text-white">
              <i class=" fa fa-users" aria-current="page"> </i>
              <span class=" ms-3 d-none d-sm-inline"> Add User</span>
            </a>
          </li>
          }


          <li class="nav-item ">
            <a (click)="generateReport()" class="nav-link text-white">
              <i class=" fa fa-solid fa-file" aria-current="page"> </i>
              <span class=" ms-3 d-none d-sm-inline"> Generate Report</span>
            </a>
          </li>
        </ul>

      </div>
   
      <div>
        <div class="dropdown open">
          <a class="btn border-none outline-none text-white dropdown-toggle" type="button" id="triggerId"
            data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <li class="fa fa-user"></li><span class="ms-1">{{logUser.Name}}</span>
          </a>
          <div class="dropdown-menu" aria-labelledby="triggerId">
            <a (click)="logout()" class="dropdown-item">Logout</a>
          </div>
        </div>
      </div>
    
    </div>
    }

    <div class="col-10 py-3">
      <app-alert></app-alert>
      <router-outlet></router-outlet>


    </div>

  </div>
</div>
