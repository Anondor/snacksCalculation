<div>


<div class="card">
  <div class="card-header text-center">
    <h5> Balance Summary </h5>

  </div>
  <div class="card-body">


    <form [formGroup]="reportForm" (ngSubmit)="loadBalance()">



      @if(!!userValue && userValue.typ!=normalUserType)
      {
      <div class="form-group">
        <label>Choose User</label>
        <!--
          <select class="form-select" aria-label="Default select example" formControlName="userId">
          @for (item of userList; track item.id) {
          <option value="{{ item.id }}">{{ item.name }}</option>
          }
        </select>
        -->
        <ngx-select-dropdown [instanceId]="'dropdown_1'" tabindex="0" [multiple]="false" [(ngModel)]="singleSelect"
          [config]="config" [options]="userList" [ngModelOptions]="{standalone: true}"></ngx-select-dropdown>
      
      </div>
      }


      <div class="form-group">
        <label>From Date</label>
        <input type="date" class="form-control" [max]="maxDate" formControlName="fromDate">
      </div>
      <div class="form-group">
        <label>To Date</label>
        <input type="date" class="form-control" [max]="maxDate" formControlName="toDate">
      </div>



      <div class="form-group" style="margin-top: 1ch;">
        <button type="submit" class="btn btn-primary"
          [disabled]="reportForm.value.fromDate==null || reportForm.value.toDate==null">Load</button>

      </div>
    </form>
  </div>
</div>



</div>

@if(rows.length){

<div class="card" style="margin-top: 2ch;">
  <div class="card-header text-center">
    <h5>{{userName}}'s Balance Summary </h5>

  </div>
  <div class="card-body">
    <ngx-datatable
        class="material"
        [rows]="rows"
      
        [columnMode]="ColumnMode.force"
        [headerHeight]="50"
        [footerHeight]="50"
        rowHeight="auto"
        (tableContextmenu)="onTableContextMenu($event)"
    
      >
      <ngx-datatable-column name="Sl" [width]="80"> </ngx-datatable-column>
      <ngx-datatable-column name="Date" [width]="300"></ngx-datatable-column>
      <ngx-datatable-column name="Amount"></ngx-datatable-column>
     
    </ngx-datatable>

  </div> 


  </div>
}
